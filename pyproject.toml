[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huntx"
dynamic = ["version"]
description = "Passive, offline Android & API reconnaissance from APK, XAPK and APKS packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The HUNTX Authors" }]
keywords = ["android", "apk", "security", "reconnaissance", "static-analysis", "api"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
huntx = "huntx.cli.commands:cli_app"

[tool.setuptools.dynamic]
version = { attr = "huntx.__version__" }

[tool.setuptools.packages.find]
include = ["huntx*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Real defects only; style of the existing code is left alone
select = ["F", "E9", "B", "S110", "S112", "S307", "S602", "S605", "PLE"]
ignore = ["B008"] # typer declares options as defaults
per-file-ignores = { "tests/*" = ["S110"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
